appId: com.laiweb.laipdf
productName: LaiPDF
copyright: Copyright (c) 2026 株式会社 L'aide
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js}'
asarUnpack:
  - resources/**
extraResources:
  - from: docs/LaiPDF-manual.pdf
    to: manual.pdf
win:
  executableName: LaiPDF
  target:
    - target: nsis
      arch:
        - x64
  # 電子署名なし (EV 証明書取得後に追加)
nsis:
  artifactName: LaiPDF-${version}-setup.${ext}
  shortcutName: LaiPDF
  uninstallDisplayName: LaiPDF
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  installerSidebar: build/icon.png
npmRebuild: false
publish:
  provider: github
  owner: nukui0206-bit
  repo: laipdf
  releaseType: release
  vPrefixedTagName: true
